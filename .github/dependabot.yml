# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      # These track branches (@master/@main) as neither project tags releases, and their
      # real logic runs from floating container images. Bumps were pure noise from unrelated
      # monorepo commits. They stay locked in actions.lock; refresh with `gh actions-lock --relock`.
      - dependency-name: "home-assistant/actions*"
      - dependency-name: "hacs/action"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"