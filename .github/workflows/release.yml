name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Adjust version number"
        shell: "bash"
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          yq -i -o json '.version=strenv(TAG_NAME)' \
            "${GITHUB_WORKSPACE}/custom_components/emeraldenergy/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${GITHUB_WORKSPACE}/custom_components/emeraldenergy"
          zip emeraldenergy.zip -r ./

      - name: "Upload the ZIP file to the release"
        shell: "bash"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" --repo "$REPO" --clobber \
            "${GITHUB_WORKSPACE}/custom_components/emeraldenergy/emeraldenergy.zip"
