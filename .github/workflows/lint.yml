name: "Lint"

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions: {}

jobs:
  ruff:
    # Job name is referenced by checkName in dependabot-auto-merge.yml
    name: "Ruff"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: "Upgrade pip"
        run: python3 -m pip install --upgrade pip

      - name: "Install requirements"
        run: python3 -m pip install -r requirements.txt

      - name: "Run"
        run: python3 -m ruff check .

      - name: "Audit workflows (zizmor)"
        # --offline: no token or network access, static analysis of the YAML only
        run: zizmor --offline --format=github .github/workflows
