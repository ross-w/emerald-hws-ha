name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# A newer push to the same PR cancels any in-flight run for an older head.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Use the PR author rather than github.actor (the last actor to trigger the run)
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    # Every step is pinned to the head SHA this run was triggered for, so a stale run
    # can never check, wait on, or merge a different head than it validated.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check changed files
        id: check-files
        run: |
          # Get the list of files changed in this exact head (three-dot compare, same as the PR diff)
          FILES=$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.files[].filename')
          echo "Changed files: $FILES"

          # Check if only allowed files are changed
          ALLOWED=true
          for file in $FILES; do
            if [[ "$file" == .github/workflows/*.yml ]] || [[ "$file" == .github/workflows/*.yaml ]] || [[ "$file" == ".github/workflows/actions.lock" ]] || [[ "$file" == "requirements.txt" ]]; then
              echo "Allowed file: $file"
            else
              echo "Non-allowed file: $file"
              ALLOWED=false
              break
            fi
          done

          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"

      - name: Wait for status checks
        if: steps.check-files.outputs.allowed == 'true'
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: wait-for-checks
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: Ruff
          ref: ${{ github.event.pull_request.head.sha }}
          timeoutSeconds: 600

      - name: Auto-merge Dependabot PR
        if: steps.check-files.outputs.allowed == 'true' && steps.wait-for-checks.outputs.conclusion == 'success'
        run: |
          # --match-head-commit: refuse if the PR head has moved since this run was triggered
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" --repo "$REPO" "$PR_NUMBER"
