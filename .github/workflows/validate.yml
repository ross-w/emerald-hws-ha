name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions: {}

# hassfest and hacs/action track branches (neither project tags releases) and the
# real logic runs from floating container images. They are locked in actions.lock
# and ignored by Dependabot; refresh with `gh actions-lock --relock`.
jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Run HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"
